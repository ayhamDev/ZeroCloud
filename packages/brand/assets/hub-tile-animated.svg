<svg xmlns="http://www.w3.org/2000/svg" class="zch-motion zch-once" data-motion-variant="once" width="128" height="128" viewBox="0 0 128 128" fill="#09090b">
  <title>ZeroCloud Hub app icon</title>
  <style>
    .zch-motion.zch-once .zch-dot { transform-box: fill-box; transform-origin: center; }
    .zch-motion.zch-once .zch-satellite { opacity: var(--hub-opacity, 1); }
    .zch-motion.zch-once .zch-connector { opacity: .38; }
    @media (prefers-reduced-motion: no-preference) {
    .zch-motion.zch-once .zch-center { animation: zch-center-breathe-once var(--product-motion-duration, 3600ms) cubic-bezier(.32,.72,0,1) 1 both; }
    .zch-motion.zch-once .zch-satellite { animation: zch-orbit-tap-once var(--product-motion-duration, 3600ms) cubic-bezier(.32,.72,0,1) 1 both; animation-delay: calc(var(--hub-step) * 140ms); }
    .zch-motion.zch-once .zch-connector { animation: zch-link-in-once var(--product-motion-duration, 3600ms) cubic-bezier(.32,.72,0,1) 1 both; animation-delay: calc(var(--hub-step) * 140ms); }
    }
    [data-motion-hub]:not([data-playing]) .zch-motion.zch-once .zch-dot { animation: none; }
    @media print { .zch-motion.zch-once .zch-dot { animation: none; } }
    @keyframes zch-orbit-tap-once {
    0%, 23%, 100% { opacity: var(--hub-opacity, 1); transform: scale(1); }
    8% { opacity: 1; transform: scale(1.12); }
    }
    @keyframes zch-link-in-once {
    0%, 9%, 34%, 100% { opacity: .38; transform: translate(0, 0); }
    18% { opacity: .88; transform: translate(var(--hub-x), var(--hub-y)); }
    }
    @keyframes zch-center-breathe-once {
    0%, 36%, 58%, 100% { transform: scale(1); }
    44% { transform: scale(1.08); }
    }
    @media print { .zch-motion.zch-once * { animation: none !important; } }
  </style>
  <rect width="128" height="128" rx="32" fill="#b9efd1"/>
  <g transform="translate(16 16) scale(1.5)">
    <circle class="zch-dot zch-center" cx="32" cy="32" r="5.5"/>
    <circle class="zch-dot zch-satellite" style="--hub-step:0" cx="32" cy="8" r="4"/>
    <circle class="zch-dot zch-satellite" style="--hub-step:2" cx="56" cy="32" r="4"/>
    <circle class="zch-dot zch-satellite" style="--hub-step:4" cx="32" cy="56" r="4"/>
    <circle class="zch-dot zch-satellite" style="--hub-step:6" cx="8" cy="32" r="4"/>
    <circle class="zch-dot zch-satellite" style="--hub-step:7;--hub-opacity:.62" cx="16" cy="16" r="3.4"/>
    <circle class="zch-dot zch-satellite" style="--hub-step:1;--hub-opacity:.62" cx="48" cy="16" r="3.4"/>
    <circle class="zch-dot zch-satellite" style="--hub-step:3;--hub-opacity:.62" cx="48" cy="48" r="3.4"/>
    <circle class="zch-dot zch-satellite" style="--hub-step:5;--hub-opacity:.62" cx="16" cy="48" r="3.4"/>
    <circle class="zch-dot zch-connector" style="--hub-step:0;--hub-x:0px;--hub-y:1.8px" cx="32" cy="20" r="2"/>
    <circle class="zch-dot zch-connector" style="--hub-step:2;--hub-x:-1.8px;--hub-y:0px" cx="44" cy="32" r="2"/>
    <circle class="zch-dot zch-connector" style="--hub-step:4;--hub-x:0px;--hub-y:-1.8px" cx="32" cy="44" r="2"/>
    <circle class="zch-dot zch-connector" style="--hub-step:6;--hub-x:1.8px;--hub-y:0px" cx="20" cy="32" r="2"/>
    <circle class="zch-dot zch-connector" style="--hub-step:7;--hub-x:1.2px;--hub-y:1.2px" cx="24" cy="24" r="1.8"/>
    <circle class="zch-dot zch-connector" style="--hub-step:1;--hub-x:-1.2px;--hub-y:1.2px" cx="40" cy="24" r="1.8"/>
    <circle class="zch-dot zch-connector" style="--hub-step:3;--hub-x:-1.2px;--hub-y:-1.2px" cx="40" cy="40" r="1.8"/>
    <circle class="zch-dot zch-connector" style="--hub-step:5;--hub-x:1.2px;--hub-y:-1.2px" cx="24" cy="40" r="1.8"/>
  </g>
</svg>
