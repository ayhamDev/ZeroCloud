<svg xmlns="http://www.w3.org/2000/svg" class="zcc-motion zcc-loop" data-motion-variant="loop" width="64" height="64" viewBox="0 0 64 64" fill="currentColor">
  <title>ZeroCloud Cast</title>
  <style>
    .zcc-motion.zcc-loop .zcc-screen-dot { opacity: .82; }
    .zcc-motion.zcc-loop .zcc-origin { transform-box: fill-box; transform-origin: center; }
    .zcc-motion.zcc-loop .zcc-wave { opacity: var(--zcc-opacity, 1); transform-box: fill-box; transform-origin: left bottom; }
    @media (prefers-reduced-motion: no-preference) {
    .zcc-motion.zcc-loop .zcc-screen-dot { animation: zcc-screen-rest-loop var(--product-motion-duration, 4200ms) cubic-bezier(.32,.72,0,1) infinite; animation-delay: calc(var(--zcc-step) * 35ms); }
    .zcc-motion.zcc-loop .zcc-origin { animation: zcc-cast-pulse-loop var(--product-motion-duration, 4200ms) cubic-bezier(.32,.72,0,1) infinite; }
    .zcc-motion.zcc-loop .zcc-wave { animation: zcc-broadcast-loop var(--product-motion-duration, 4200ms) cubic-bezier(.32,.72,0,1) infinite; animation-delay: var(--zcc-delay); }
    }
    [data-motion-product]:not([data-playing]) .zcc-motion.zcc-loop .zcc-screen-dot, [data-motion-product]:not([data-playing]) .zcc-motion.zcc-loop .zcc-origin, [data-motion-product]:not([data-playing]) .zcc-motion.zcc-loop .zcc-wave { animation: none; }
    @media print { .zcc-motion.zcc-loop * { animation: none !important; } }
    @keyframes zcc-screen-rest-loop { 0%, 12%, 74%, 100% { opacity: .82; } 36% { opacity: 1; } }
    @keyframes zcc-cast-pulse-loop { 0%, 12%, 74%, 100% { transform: none; } 26% { transform: scale(1.10); } }
    @keyframes zcc-broadcast-loop { 0%, 12%, 74%, 100% { opacity: var(--zcc-opacity,1); transform: none; } 36% { opacity: 1; transform: scale(1.04); } }
  </style>
  <circle class="zcc-screen-dot" style="--zcc-step:0" cx="14" cy="10" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:1" cx="22" cy="10" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:2" cx="30" cy="10" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:3" cx="38" cy="10" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:4" cx="46" cy="10" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:5" cx="54" cy="10" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:6" cx="14" cy="18" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:7" cx="14" cy="26" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:8" cx="54" cy="18" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:9" cx="54" cy="26" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:10" cx="54" cy="34" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:11" cx="54" cy="42" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:12" cx="46" cy="42" r="2.6"/>
  <circle class="zcc-screen-dot" style="--zcc-step:13" cx="38" cy="42" r="2.6"/>
  <circle class="zcc-origin" cx="10" cy="54" r="3.2"/>
  <g class="zcc-wave" style="--zcc-opacity:0.72;--zcc-delay:220ms">
  <circle cx="10" cy="46" r="2.5"/>
  <circle cx="16" cy="48" r="2.5"/>
  <circle cx="18" cy="54" r="2.5"/>
  </g>
  <g class="zcc-wave" style="--zcc-opacity:0.38;--zcc-delay:400ms">
  <circle cx="10" cy="36" r="2.5"/>
  <circle cx="18" cy="38" r="2.5"/>
  <circle cx="26" cy="44" r="2.5"/>
  <circle cx="28" cy="54" r="2.5"/>
  </g>
</svg>
