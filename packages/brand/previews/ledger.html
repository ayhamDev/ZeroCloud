<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ZeroCloud Ledger — Brand preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafbf9; color: #09090b; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(1120px, calc(100% - 48px)); margin: 64px auto; }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 60px); letter-spacing: -.05em; line-height: 1; }
    header p { margin: 24px 0 48px; max-width: 52ch; color: #555d58; }
    .variants { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    figure { margin: 0; padding: 32px; background: #f8f5de; border-radius: 24px; }
    .tile { display: grid; place-items: center; min-height: 224px; }
    .tile > svg { width: min(100%, 192px); height: auto; display: block; }
    figcaption { margin-top: 24px; font-weight: 600; }
    figcaption span { display: block; color: #555d58; font-size: 14px; font-weight: 400; margin-top: 8px; }
    .sizes { display: flex; align-items: center; gap: 32px; margin-top: 48px; flex-wrap: wrap; }
    .sizes svg { display: block; width: var(--size); height: var(--size); }
    .sizes p { margin: 8px 0 0; color: #555d58; font-size: 14px; }
    @media (max-width: 700px) { main { margin: 32px auto; } .variants { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header><h1>ZeroCloud Ledger</h1><p>Two account links coming together. Shared records remain connected across paired devices.</p></header>
    <div class="variants">

</div><figcaption>Static<span>The final composition.</span></figcaption></figure>

      @media (prefers-reduced-motion: no-preference) { .zcledger-motion.zcledger-once .zcledger-link { animation: zcledger-join-once var(--product-motion-duration, 1400ms) cubic-bezier(.32,.72,0,1) 1 both; animation-delay:var(--part-delay); } }
      [data-motion-product]:not([data-playing]) .zcledger-motion.zcledger-once .zcledger-link { animation:none; }

</div><figcaption>Once<span>1.6 seconds including stagger.</span></figcaption></figure>
      <figure><div class="tile"><svg xmlns="http://www.w3.org/2000/svg" class="zcledger-motion zcledger-loop" data-motion-variant="loop" width="128" height="128" viewBox="0 0 128 128" fill="#09090b"><title>ZeroCloud Ledger app icon</title><style>

    </style><rect width="128" height="128" rx="32" fill="#f2e99b"/><g transform="translate(16 16) scale(1.5)"><g class="zcledger-link" style="--part-x:-1px;--part-y:-.5px;--part-delay:0ms"><circle cx="8" cy="12" r="2.5"/><circle cx="16" cy="8" r="2.5"/><circle cx="24" cy="8" r="2.5"/><circle cx="32" cy="12" r="2.5"/><circle cx="32" cy="36" r="2.5"/><circle cx="16" cy="40" r="2.5"/><circle cx="8" cy="36" r="2.5"/><circle cx="4" cy="28" r="2.5"/><circle cx="4" cy="20" r="2.5"/></g><g class="zcledger-link" style="--part-x:1px;--part-y:.5px;--part-delay:200ms"><circle cx="28" cy="28" r="2.5" opacity="0.62"/><circle cx="36" cy="24" r="2.5" opacity="0.62"/><circle cx="44" cy="24" r="2.5" opacity="0.62"/><circle cx="52" cy="28" r="2.5" opacity="0.62"/><circle cx="56" cy="36" r="2.5" opacity="0.62"/><circle cx="56" cy="44" r="2.5" opacity="0.62"/><circle cx="52" cy="52" r="2.5" opacity="0.62"/><circle cx="44" cy="56" r="2.5" opacity="0.62"/><circle cx="36" cy="56" r="2.5" opacity="0.62"/><circle cx="28" cy="52" r="2.5" opacity="0.62"/><circle cx="24" cy="44" r="2.5" opacity="0.62"/><circle cx="24" cy="36" r="2.5" opacity="0.62"/></g></g></svg>



</div><figcaption>Loop<span>A 4.8-second joining cycle with a quiet rest.</span></figcaption></figure>

  </main>
  <script>
    const time = new URLSearchParams(location.search).get('t');
    if (time !== null && Number.isFinite(Number(time))) {
      for (const animation of document.getAnimations()) {
        animation.pause();
        animation.currentTime = Math.max(0, Number(time)) * 1000;
      }
    }
    window.__ready = true;
  </script>
